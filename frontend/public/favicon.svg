<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#172B4D"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B99A5B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#B99A5B" stroke-width="2"/>

  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="#B99A5B" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Scales of Justice Emblem in Courtroom Gold -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Finial / Diamond -->
    <path d="M32 9.5 L34.5 13 L32 15.5 L29.5 13 Z" stroke-width="0.5"/>

    <!-- Main Vertical Column -->
    <line x1="32" y1="14" x2="32" y2="48" stroke-width="2.5"/>

    <!-- Horizontal Balance Bar -->
    <path d="M16 19 Q32 17.5 48 19" fill="none" stroke-width="2.5"/>
    
    <!-- Center Pivot Knob -->
    <circle cx="32" cy="18" r="2.5" stroke-width="0.5"/>

    <!-- Left Pan Strings -->
    <line x1="16" y1="19" x2="11" y2="30" stroke-width="1.2"/>
    <line x1="16" y1="19" x2="21" y2="30" stroke-width="1.2"/>
    <!-- Left Scale Pan -->
    <path d="M10 30 Q16 35.5 22 30 Z" stroke-width="1"/>

    <!-- Right Pan Strings -->
    <line x1="48" y1="19" x2="43" y2="30" stroke-width="1.2"/>
    <line x1="48" y1="19" x2="53" y2="30" stroke-width="1.2"/>
    <!-- Right Scale Pan -->
    <path d="M42 30 Q48 35.5 54 30 Z" stroke-width="1"/>

    <!-- Pedestal Base of Justice -->
    <path d="M24 48 L40 48" stroke-width="2.5"/>
    <path d="M20 52 L44 52" stroke-width="2.5"/>
  </g>
</svg>